[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kala-agent"
version = "0.1.0"
description = "A local-first engineering design agent foundation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
serve = [
    "uvicorn>=0.30",
]
dev = [
    "coverage>=7.6",
    "httpx>=0.27",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "uvicorn>=0.30",
]

[project.scripts]
kala-agent = "kala_agent.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kala_agent*"]

[tool.pytest.ini_options]
minversion = "8.3"
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["kala_agent"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2
fail_under = 90

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "ANN", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["kala_agent"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
warn_unreachable = true
show_error_codes = true
pretty = true
