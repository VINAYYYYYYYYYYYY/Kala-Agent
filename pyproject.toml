[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kala-agent"
version = "0.1.0"
description = "CAD design agent"
requires-python = ">=3.12"
dependencies = [
    "cadquery-ocp",
    "PyQt6>=6.6.0",
]

[tool.setuptools.packages.find]
include = ["kala*"]

[project.scripts]
kala = "kala.cli:main"
kala-ui = "kala.ui.desktop:main"
