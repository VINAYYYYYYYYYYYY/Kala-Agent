[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kala-agent"
version = "0.1.0"
description = "An AI-powered CAD agent with a modular architecture"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]
opencascade = ["cadquery", "OCP"]

[project.scripts]
kala = "kala.cli:main"
