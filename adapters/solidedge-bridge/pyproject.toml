[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kala-solidedge-bridge"
version = "0.1.0"
description = "Strict wire contract and Windows worker bridge for Solid Edge"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10,<3",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.6",
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
]

[project.scripts]
kala-se-bridge = "kala_solidedge_bridge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kala_solidedge_bridge*"]

[tool.pytest.ini_options]
minversion = "8.3"
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
pythonpath = ["src"]
xfail_strict = true
markers = [
    "solidedge: live Windows Solid Edge tests; require an explicit opt-in and a real desktop session",
]

[tool.coverage.run]
branch = true
source = ["kala_solidedge_bridge"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2
fail_under = 80

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "ANN", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["kala_solidedge_bridge"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
mypy_path = ["src"]
warn_unreachable = true
show_error_codes = true
pretty = true

# pytest's assertion helpers import numpy, whose installed stubs use Python
# 3.12 `type` statements that cannot be parsed under this package's 3.11
# target. numpy and pytest are not package dependencies, so their internals are
# not analyzed; the test bodies themselves are still type-checked strictly.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "_pytest", "_pytest.*", "pytest", "pytest.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["test_protocol", "test_units"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "test_auth",
    "test_calibration",
    "test_cli",
    "test_jobs",
    "test_live_solidedge",
    "test_probe",
    "test_runtime_edges",
    "test_server",
    "test_session",
    "test_worker",
]
disallow_untyped_decorators = false
