[workspace]
resolver = "3"

[package]
name = "kala-cad"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false
description = "Native exact B-rep construction compiler, measurement, tessellation, STEP I/O, HLR drawings and section cuts over a narrow OpenCascade FFI adapter"

[features]
# The native kernel is the product capability. Building with
# `--no-default-features` is an explicit unavailable mode: the public API is
# present but every geometry operation fails with a typed "unavailable" error
# and `design_available()` is false. It never substitutes approximations.
default = ["native"]
native = []

[dependencies]
# Accepted contract crate, consumed read-only. It owns the frozen construction
# bounds, loaders, aliases and insertion-order profile semantics; this crate
# never re-implements them.
kala-contracts = { path = "../kala-contracts" }

[build-dependencies]
cc = "1.2"

[dev-dependencies]
serde_json = "1.0"

[profile.release]
strip = "symbols"
