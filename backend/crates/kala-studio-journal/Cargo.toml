[workspace]
resolver = "3"

[package]
name = "kala-studio-journal"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false
description = "Native Studio session journal and content-addressed artifact store, byte-compatible with the Kala Agent Python journal"

[dependencies]
# Accepted read-only sibling crates. This cell keeps its own workspace and
# lockfile so it never writes the root backend manifest or lock.
kala-artifacts = { path = "../kala-artifacts" }
kala-json = { path = "../kala-json" }
kala-persistence = { path = "../kala-persistence" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
parking_lot = "0.12"
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
sha2 = "0.10"
thiserror = "2.0"

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
kala-json = { path = "../kala-json" }
kala-persistence = { path = "../kala-persistence" }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"

[profile.release]
strip = "symbols"
