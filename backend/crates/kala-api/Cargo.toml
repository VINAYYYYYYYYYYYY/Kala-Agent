# The Kala core API connection layer is deliberately a standalone workspace
# with its own lockfile.  The parent workspace is owned by another cell; adding
# a member or editing its lock here would violate that ownership boundary.
[workspace]
members = []

[package]
name = "kala-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false
description = "The Kala local API connection layer: loopback and origin boundary gates, the launch bearer token, the bounded body limit, the security header set and the sanitized error envelope"

[dependencies]
bytes = "1"
getrandom = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "server", "server-graceful", "tokio"] }
# The accepted canonical JSON crate.  It reproduces CPython's
# `json.dumps(..., sort_keys=True)` escaping byte for byte, which is what the
# Python transport refusal body is.
kala-json = { path = "../kala-json" }
# The accepted contract crate.  The API models carry the contract models of
# the composition root (a revision, its provenance, an evaluation result and an
# approval request) and the ordered wire document FastAPI writes.
kala-contracts = { path = "../kala-contracts" }
# The native boundary crate.  On Windows a POSIX mode is not meaningful, so the
# launch token file is restricted with the owner-only DACL helper it exposes;
# the crate's process supervision is not used here.
kala-process = { path = "../kala-process" }
# Arbitrary precision integers, which Pydantic accepts for an `int` field.
num-bigint = "0.4"
# The number format of the answers, which the JSON serializer of the Python
# framework writes in Rust.
serde_json = "1"
# The same WHATWG URL parser pydantic-core uses, so the `model_endpoint`
# validation and normalization match the Python source.
url = "2"
# The same HTTP stack the accepted kala-studio crate uses: hyper 1 over
# hyper-util's Tokio adapter, served by a Tokio reactor.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = { version = "1", features = ["arbitrary_precision"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[profile.release]
strip = "symbols"
