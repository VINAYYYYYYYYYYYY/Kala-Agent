[workspace]
resolver = "3"

[package]
name = "kala-cad-providers"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false
description = "Native CAD provider connections for the Kala Agent backend: the FreeCADCmd subprocess provider and the Solid Edge loopback-bridge provider"

# This crate is deliberately a standalone workspace with its own lock file. The
# accepted root backend workspace is owned by another cell; adding a member or
# editing its lock here would violate that ownership boundary.
[dependencies]
# Accepted read-only sibling crates.
kala-contracts = { path = "../kala-contracts" }
kala-json = { path = "../kala-json" }
kala-process = { path = "../kala-process" }
kala-solidedge-client = { path = "../kala-solidedge-client" }
num-bigint = "0.4"
num-traits = "0.2"
regex = "1"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"

[profile.release]
strip = "symbols"
