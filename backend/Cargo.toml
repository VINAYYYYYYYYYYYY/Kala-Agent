[workspace]
members = [
    "crates/kala-json",
    "crates/kala-persistence",
    "crates/kala-geometry",
    "crates/kala-budget",
    "crates/kala-step",
    "crates/kala-artifacts",
    "crates/kala-studio",
]
# The crates that remain separate standalone workspaces with their own
# manifests and locks, written by independent cells under review. They are
# excluded explicitly so root commands never resolve or build them as
# members, and so a path dependency on one of them is accepted instead of
# being reported as a second workspace root.
exclude = [
    "crates/kala-contracts",
    "crates/kala-process",
    "crates/kala-solidedge-client",
    "crates/kala-cad",
    "crates/kala-cad-providers",
    "crates/kala-design-intent",
    "crates/kala-studio-journal",
]
resolver = "3"

[workspace.package]
# Declared floor inherited from the accepted slices; only rustc/cargo 1.99.1
# has actually been used. See README.md "Toolchain".
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.3.4"
libc = "0.2"
num-bigint = "0.4"
num-traits = "0.2"
parking_lot = "0.12"
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
rustix = "1.1.5"
ryu = "1.0"
serde = "1.0"
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
windows-sys = "0.61.2"

[profile.release]
strip = "symbols"
